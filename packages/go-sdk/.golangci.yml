version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enabled-checks:
        - nestingReduce
        - unnamedResult
        - ruleguard
    gosec:
      excludes:
        # Unhandled errors in tests.
        - G104
        # G704 (SSRF via taint analysis) is new in gosec under golangci-lint v2.
        # It fires on `rc.client.Do(req)` in janua/retry.go — the retry wrapper of
        # an HTTP SDK, whose whole purpose is issuing requests to a caller-supplied
        # endpoint. Taint analysis cannot distinguish that from an attacker-controlled
        # URL, so the same rule would flag every HTTP client library ever written.
        # Scoped exclusion, not a blanket suppression: if this SDK ever builds a URL
        # from data it did not receive from its own caller, revisit this.
        - G704
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
          severity: warning
        - name: var-naming
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - revive
        path: _test\.go
      - linters:
          - gosec
        text: weak cryptographic primitive
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
